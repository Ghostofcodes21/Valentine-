<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Everlasting Candle Flame</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #222;
    }

    .candle {
      position: relative;
      width: 60px;
      height: 200px;
      background: #d4af37;
      border-radius: 30px;
      box-shadow: 0 0 15px 3px rgba(255, 255, 255, 0.5);
    }

    .wick {
      position: absolute;
      top: 10px;
      left: 50%;
      width: 8px;
      height: 25px;
      background: #000;
      transform: translateX(-50%);
    }

    .flame {
      position: absolute;
      top: -50px;
      left: 50%;
      width: 50px;
      height: 80px;
      background: radial-gradient(circle, #ffdb4d, #ff8000, #ff4500);
      border-radius: 50%;
      transform: translateX(-50%);
      opacity: 0.85;
      animation: flicker 0.2s infinite, glow 1.5s infinite alternate;
    }

    @keyframes flicker {
      0%, 100% {
        transform: translateX(-50%) scale(1.05);
        opacity: 0.9;
      }
      50% {
        transform: translateX(calc(-50% + 3px)) scale(1.2);
        opacity: 1;
      }
    }

    @keyframes glow {
      0% {
        filter: drop-shadow(0 0 10px #ff8000) drop-shadow(0 0 20px #ff4500);
      }
      100% {
        filter: drop-shadow(0 0 15px #ff8000) drop-shadow(0 0 25px #ff4500);
      }
    }
  </style>
</head>
<body>
  <div class="candle">
    <div class="wick"></div>
    <div class="flame"></div>
  </div>
</body>
</html>
