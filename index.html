<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Truck Button</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #f4f4f4;
    }

    .truck-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 150px;
      height: 60px;
      background: #0078d7;
      color: white;
      font-size: 18px;
      font-weight: bold;
      text-transform: uppercase;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      overflow: hidden;
      box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .truck-btn:hover {
      transform: translateX(5px);
      box-shadow: 0px 6px 12px rgba(0, 0, 0, 0.3);
    }

    .truck-btn::before, .truck-btn::after {
      content: '';
      position: absolute;
      bottom: -15px;
      width: 20px;
      height: 20px;
      background: black;
      border-radius: 50%;
      transition: transform 0.3s;
    }

    .truck-btn::before {
      left: 20px;
    }

    .truck-btn::after {
      right: 20px;
    }

    .truck-btn:hover::before {
      transform: translateX(5px);
    }

    .truck-btn:hover::after {
      transform: translateX(5px);
    }

    .truck-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .truck-icon {
      width: 30px;
      height: 20px;
      background: #ff9900;
      border-radius: 4px;
      position: relative;
    }

    .truck-icon::after {
      content: '';
      position: absolute;
      top: -8px;
      right: -12px;
      width: 12px;
      height: 12px;
      background: #ffcc00;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <button class="truck-btn">
    <div class="truck-container">
      <div class="truck-icon"></div>
      Order
    </div>
  </button>
</body>
</html>
