<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Store</title>
  <style>
  /* General Styles */
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
  background-color: #f9f9f9;
  color: #333;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 20px;
  background: #000;
  color: #fff;
}

header .quick-links a {
  color: #fff;
  margin: 0 10px;
  text-decoration: none;
}

header .quick-links a:hover {
  text-decoration: underline;
}

main {
  margin: 20px;
}

.section {
  margin-bottom: 40px;
}

h2 {
  text-align: center;
  margin-bottom: 20px;
}

/* Slider Styles */
.slider {
  position: relative;
  display: flex;
  align-items: center;
  overflow: hidden;
}

.slides {
  display: flex;
  transition: transform 0.5s ease-in-out;
}

.slides img, .slides .product {
  margin-right: 10px;
}

.slider.small img {
  width: 100px;
  height: 100px;
  object-fit: cover;
}

.slider.large .product {
  position: relative;
}

.slider.large img {
  width: 300px;
  height: 200px;
  object-fit: cover;
}

.slider.large .description {
  position: absolute;
  top: 10px;
  left: 10px;
  background: rgba(0, 0, 0, 0.5);
  color: #fff;
  padding: 5px;
  font-size: 14px;
  border-radius: 4px;
}

.slider-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(0, 0, 0, 0.6);
  color: #fff;
  border: none;
  padding: 10px 15px;
  cursor: pointer;
  z-index: 10;
}

.slider-btn.prev {
  left: 10px;
}

.slider-btn.next {
  right: 10px;
}

.slider-btn:hover {
  background: #333;
}

/* Hover Effects */
img:hover, .product:hover {
  transform: scale(1.05);
  transition: transform 0.3s;
}
    /* Video Slider Styles */
.video-slider {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  max-width: 100%;
  overflow: hidden;
}

.video-slides {
  display: flex;
  transition: transform 0.5s ease-in-out;
}

.video-slide {
  margin-right: 10px;
  max-width: 800px;
  width: 100%;
}

video {
  width: 100%;
  height: auto;
  border-radius: 10px;
}

.slider-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(0, 0, 0, 0.6);
  color: #fff;
  border: none;
  padding: 10px 15px;
  cursor: pointer;
  z-index: 10;
}

.slider-btn.prev {
  left: 10px;
}

.slider-btn.next {
  right: 10px;
}

.slider-btn:hover {
  background: #333;
}

/* Responsive Styling */
@media (max-width: 768px) {
  .video-slider {
    max-width: 90%;
  }
}
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <div class="logo">Brand</div>
    <nav class="quick-links">
      <a href="#">Mac</a>
      <a href="#">Phone</a>
      <a href="#">Laptop</a>
      <a href="#" class="search">Search</a>
      <a href="#" class="cart">Cart</a>
    </nav>
  </header>

  <!-- Main Content -->
  <main>
    <!-- Section 1 -->
    <section class="section" id="section1">
      <h2>Small Product Images</h2>
      <div class="slider small">
        <button class="slider-btn prev">&lt;</button>
        <div class="slides">
          <!-- Add 7 small product images -->
          <img src="product1.jpg" alt="Product 1">
          <img src="product2.jpg" alt="Product 2">
          <img src="product3.jpg" alt="Product 3">
          <img src="product4.jpg" alt="Product 4">
          <img src="product5.jpg" alt="Product 5">
          <img src="product6.jpg" alt="Product 6">
          <img src="product7.jpg" alt="Product 7">
        </div>
        <button class="slider-btn next">&gt;</button>
      </div>
    </section>

    <!-- Section 2 -->
    <section class="section" id="section2">
      <h2>Large Product Images with Descriptions</h2>
      <div class="slider large">
        <button class="slider-btn prev">&lt;</button>
        <div class="slides">
          <!-- Add 7 large product images with descriptions -->
          <div class="product">
            <img src="product1.jpg" alt="Product 1">
            <div class="description">Product 1 - $199</div>
          </div>
          <div class="product">
            <img src="product2.jpg" alt="Product 2">
            <div class="description">Product 2 - $249</div>
          </div>
          <!-- Add more products -->
        </div>
        <button class="slider-btn next">&gt;</button>
      </div>
    </section>
    <!-- Section 7: Video Slider -->
<!-- Section 7: Video Slider -->
<section class="section" id="section7">
  <h2>Featured Videos</h2>
  <div class="video-slider">
    <button class="slider-btn prev">&lt;</button>
    <div class="video-slides">
      <!-- Add multiple videos in the slider -->
      <div class="video-slide">
        <video class="video" preload="auto">
          <source src="video1.mp4" type="video/mp4">
          Your browser does not support the video tag.
        </video>
      </div>
      <div class="video-slide">
        <video class="video" preload="auto">
          <source src="video2.mp4" type="video/mp4">
          Your browser does not support the video tag.
        </video>
      </div>
      <div class="video-slide">
        <video class="video" preload="auto">
          <source src="video3.mp4" type="video/mp4">
          Your browser does not support the video tag.
        </video>
      </div>
      <!-- Add more video slides as needed -->
    </div>
    <button class="slider-btn next">&gt;</button>
  </div>
</section>
      <!-- Add more video slides as needed -->
    </div>
    <button class="slider-btn next">&gt;</button>
  </div>
</section>

    <!-- Additional sections (3 to 7) are similar, structure follows the same pattern -->
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 Your Brand</p>
  </footer>

  <script>
    const sliders = document.querySelectorAll('.slider');

sliders.forEach(slider => {
  const slides = slider.querySelector('.slides');
  const prevButton = slider.querySelector('.prev');
  const nextButton = slider.querySelector('.next');

  let currentIndex = 0;

  const updateSlider = () => {
    const slideWidth = slides.children[0].offsetWidth + 10; // Add margin
    slides.style.transform = translateX(-${currentIndex * slideWidth}px);
  };

  prevButton.addEventListener('click', () => {
    currentIndex = currentIndex > 0 ? currentIndex - 1 : slides.children.length - 1;
    updateSlider();
  });

  nextButton.addEventListener('click', () => {
    currentIndex = currentIndex < slides.children.length - 1 ? currentIndex + 1 : 0;
    updateSlider();
  });
});
// Video Slider
// Video Slider with Autoplay on Hover
const videoSliders = document.querySelectorAll('.video-slider');

videoSliders.forEach(slider => {
  const videoSlides = slider.querySelector('.video-slides');
  const prevButton = slider.querySelector('.prev');
  const nextButton = slider.querySelector('.next');

  let currentIndex = 0;

  const updateSlider = () => {
    const videoWidth = videoSlides.children[0].offsetWidth + 10; // Add margin
    videoSlides.style.transform = translateX(-${currentIndex * videoWidth}px);
  };

  prevButton.addEventListener('click', () => {
    currentIndex = currentIndex > 0 ? currentIndex - 1 : videoSlides.children.length - 1;
    updateSlider();
  });

  nextButton.addEventListener('click', () => {
    currentIndex = currentIndex < videoSlides.children.length - 1 ? currentIndex + 1 : 0;
    updateSlider();
  });

  // Autoplay on hover for video elements
  const videos = slider.querySelectorAll('.video');

  videos.forEach(video => {
    video.addEventListener('mouseenter', () => {
      video.play(); // Start playing video when mouse enters
    });

    video.addEventListener('mouseleave', () => {
      video.pause(); // Pause video when mouse leaves
      video.currentTime = 0; // Reset to the start of the video
    });
  });
});
  </script>
</body>
</html>
