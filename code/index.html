<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Login Form</title>
    <style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #1e1e2f;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    color: #fff;
}

.circle {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 400px;
    height: 400px;
    border: 8px solid transparent;
    border-top: 8px solid #00d2ff;
    border-right: 8px solid #00d2ff;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    animation: rotate 8s linear infinite;
}

@keyframes rotate {
    0% {
        transform: translate(-50%, -50%) rotate(0deg);
    }
    100% {
        transform: translate(-50%, -50%) rotate(360deg);
    }
}
.login-container {
    z-index: 10;
    background: rgba(0, 0, 0, 0.8);
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
    text-align: center;
    width: 300px;
    animation: fade-in 1.5s ease-in-out;
}

h2 {
    margin-bottom: 20px;
}

.input-group {
    margin-bottom: 15px;
}

.input-group input {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 5px;
    outline: none;
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
}

.input-group input::placeholder {
    color: #ccc;
}

.login-btn {
    width: 100%;
    padding: 10px;
    background: #00d2ff;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
    color: #fff;
    transition: 0.3s;
}

.login-btn:hover {
    background: #00b5e2;
}

.options {
    margin-top: 15px;
    font-size: 14px;
}

.options a {
    color: #00d2ff;
    text-decoration: none;
    margin: 0 10px;
    transition: 0.3s;
}

.options a:hover {
    color: #00b5e2;
}

@keyframes fade-in {
    0% {
        opacity: 0;
        transform: scale(0.8);
    }
    100% {
        opacity: 1;
        transform: scale(1);
    }
}
    </style>
</head>
<body>
    <div class="circle"></div>
    <div class="login-container">
        <h2>Login</h2>
        <form>
            <div class="input-group">
                <input type="text" placeholder="Username" required>
            </div>
            <div class="input-group">
                <input type="password" placeholder="Password" required>
            </div>
            <button type="submit" class="login-btn">Login</button>
            <div class="options">
                <a href="#" class="forgot-password">Forgot Password?</a>
                <a href="#" class="signup">Sign Up</a>
            </div>
        </form>
    </div>
    <script>
      document.addEventListener('mousemove', (e) => {
  const circle = document.querySelector('.circle');
  const x = e.clientX;
  const y = e.clientY;

  circle.style.transform = `translate(${x - 200}px, ${y - 200}px) rotate(${x + y}deg)`;
});
    </script>
</body>
</html>
