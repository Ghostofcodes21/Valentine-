<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Everlasting Flames</title>
  <style>
body {
margin: 0;
background: #000;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
overflow: hidden;
}

.flame-container {
position: relative;
width: 100px;
height: 200px;
}

.flame {
position: absolute;
bottom: 0;
left: 50%;
width: 30px;
height: 60px;
background: radial-gradient(circle, #ff0, #f60, #f00);
border-radius: 50%;
animation: flicker 1.5s infinite ease-in-out;
transform: translateX(-50%);
opacity: 0.8;
}

.flame1 {
width: 40px;
height: 80px;
animation-delay: 0s;
}

.flame2 {
width: 30px;
height: 70px;
animation-delay: 0.2s;
}

.flame3 {
width: 20px;
height: 50px;
animation-delay: 0.4s;
}

.flame4 {
width: 10px;
height: 40px;
animation-delay: 0.6s;
}

@keyframes flicker {
0%, 100% {
transform: translateX(-50%) scale(1);
opacity: 0.8;
}
50% {
transform: translateX(-50%) scale(1.2);
opacity: 1;
}
75% {
transform: translateX(-50%) scale(0.9);
opacity: 0.6;
}
}
  </style>
</head>
<body>
  <div class="flame-container">
    <div class="flame flame1"></div>
    <div class="flame flame2"></div>
    <div class="flame flame3"></div>
    <div class="flame flame4"></div>
  </div>
</body>
</html>
